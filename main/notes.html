<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #note {
    box-sizing: border-box;
    width: 218px; height: 128px;
    margin: 10px;
    padding: 14px 16px;
    background: linear-gradient(180deg, #fdf6b2 0%, #f9edA0 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    transform: rotate(-2.5deg) scale(0.2);
    opacity: 0;
    font-family: "Noteworthy", "Bradley Hand", "Chalkboard SE", cursive;
    font-size: 16px;
    line-height: 1.35;
    color: #4a4232;
    cursor: pointer;
    display: flex;
    align-items: center;
    animation: pop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
  }
  #note::after {
    content: "— the goose";
    position: absolute;
    right: 18px; bottom: 10px;
    font-size: 12px;
    opacity: 0.65;
  }
  @keyframes pop { to { transform: rotate(-2.5deg) scale(1); opacity: 1; } }
  #note.dismissed { transition: opacity 0.25s, transform 0.25s; opacity: 0; transform: rotate(6deg) translateY(24px) scale(0.9); }
</style>
</head>
<body>
  <div id="note"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const note = document.getElementById('note');
    note.textContent = params.get('text') || 'honk.';
    note.addEventListener('click', () => {
      note.classList.add('dismissed');
      setTimeout(() => window.close(), 260);
    });
  </script>
</body>
</html>
