<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    background: #20242b;
    color: #e8e8e8;
    user-select: none;
  }
  .wrap { padding: 18px 20px 20px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: #9aa0ab; margin-bottom: 16px; font-size: 12px; }

  .meter-card {
    background: #2a2f38;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .meter-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
  #tier { font-weight: 600; }
  .bar {
    height: 10px;
    background: #1a1d22;
    border-radius: 5px;
    overflow: hidden;
  }
  #fill {
    height: 100%;
    width: 15%;
    border-radius: 5px;
    background: linear-gradient(90deg, #6fbf73, #e8c34a 55%, #e2543b);
    background-size: 340px 100%;
    transition: width 0.4s;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 2px;
    border-bottom: 1px solid #2c313a;
  }
  .row label { flex: 1; }
  .hint { color: #8a919d; font-size: 11px; margin-top: 2px; }
  input[type="range"] { width: 130px; }

  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 108px;
    margin-top: 8px;
    background: #1a1d22;
    color: #ddd;
    border: 1px solid #333a45;
    border-radius: 8px;
    padding: 8px;
    font: 12px/1.45 ui-monospace, monospace;
    resize: none;
  }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: #3a4150;
    color: #eee;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #454d5f; }
  #apologize { background: #4f6b52; }
  #apologize:hover { background: #5a7a5e; }
  .saved { color: #6fbf73; font-size: 11px; opacity: 0; transition: opacity 0.3s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪿 Goose Control Panel</h1>
  <div class="sub">negotiate with the goose (results not guaranteed)</div>

  <div class="meter-card">
    <div class="meter-label"><span>Entitlement</span><span id="tier">content</span></div>
    <div class="bar"><div id="fill"></div></div>
  </div>

  <div class="row">
    <label>Mute honks<div class="hint">the honks continue silently, in its heart</div></label>
    <input type="checkbox" id="muted" />
  </div>
  <div class="row">
    <label>Polite mode<div class="hint">work-safe: fewer interruptions, no demands</div></label>
    <input type="checkbox" id="polite" />
  </div>
  <div class="row">
    <label>Focus enforcement<div class="hint">closes youtube, instagram, netflix…</div></label>
    <input type="checkbox" id="focusEnforce" />
  </div>
  <div class="row">
    <label>Goose size</label>
    <input type="range" id="scale" min="120" max="260" step="10" />
  </div>

  <div class="row" style="border: 0; display: block;">
    <label>Goose phrases <span class="hint">(one per line)</span> <span class="saved" id="saved">saved</span></label>
    <textarea id="phrases" spellcheck="false"></textarea>
  </div>

  <div class="btns">
    <button id="apologize">Apologize to the goose</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let saveTimer = null;

  async function load() {
    const s = await window.panel.getState();
    $('muted').checked = s.settings.muted;
    $('polite').checked = s.settings.polite;
    $('focusEnforce').checked = s.settings.focusEnforce;
    $('scale').value = s.settings.scale;
    $('phrases').value = (s.phrases || []).join('\n');
    updateMeter(s.meter, s.tier);
  }

  function updateMeter(meter, tier) {
    $('fill').style.width = Math.round(4 + meter * 96) + '%';
    $('tier').textContent = tier || 'content';
  }

  for (const id of ['muted', 'polite', 'focusEnforce']) {
    $(id).addEventListener('change', () => window.panel.setSettings({ [id]: $(id).checked }));
  }
  $('scale').addEventListener('change', () => window.panel.setSettings({ scale: Number($('scale').value) }));

  $('phrases').addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const phrases = $('phrases').value.split('\n').map((l) => l.trim()).filter(Boolean);
      window.panel.setPhrases(phrases);
      $('saved').style.opacity = 1;
      setTimeout(() => { $('saved').style.opacity = 0; }, 1200);
    }, 600);
  });

  $('apologize').addEventListener('click', () => window.panel.apologize());

  setInterval(async () => {
    const s = await window.panel.getState();
    updateMeter(s.meter, s.tier);
  }, 700);

  load();
</script>
</body>
</html>
