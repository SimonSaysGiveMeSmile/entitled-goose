<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Azeret Mono";
    src: url("../assets/fonts/azeret-mono-var.woff2") format("woff2");
    font-weight: 400 600;
  }
  @font-face {
    font-family: "Fraunces";
    src: url("../assets/fonts/fraunces-var.woff2") format("woff2");
    font-weight: 400 900;
  }
  :root {
    --paper: #f4f1e8;
    --paper-deep: #eae6d8;
    --ink: #272725;
    --ink-dim: #86847c;
    --orange: #f58731;
    --lawn: #45785f;
    --rule: #d8d3c4;
  }
  body {
    margin: 0;
    font-family: "Azeret Mono", ui-monospace, monospace;
    font-size: 12px;
    background: var(--paper);
    color: var(--ink);
    user-select: none;
  }
  .wrap { padding: 20px 22px 22px; }
  h1 {
    font-family: "Fraunces", serif;
    font-weight: 900;
    font-size: 22px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--ink-dim); margin-bottom: 16px; font-size: 11px; font-style: italic; font-family: "Fraunces", serif; }

  .meter-card {
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .meter-label { display: flex; justify-content: space-between; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.12em; font-size: 10.5px; }
  #tier { font-weight: 600; color: var(--orange); }
  .bar { height: 9px; background: var(--rule); overflow: hidden; }
  #fill {
    height: 100%;
    width: 15%;
    background: linear-gradient(90deg, var(--lawn), #e8c34a 55%, var(--orange));
    background-size: 340px 100%;
    transition: width 0.4s;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 2px;
    border-bottom: 1px solid var(--rule);
  }
  .row label { flex: 1; }
  .hint { color: var(--ink-dim); font-size: 10px; margin-top: 2px; }
  input[type="range"] { width: 130px; accent-color: var(--orange); }
  input[type="checkbox"] { accent-color: var(--lawn); }
  select {
    background: var(--paper);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    font-family: inherit;
    font-size: 11.5px;
    padding: 3px 6px;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 108px;
    margin-top: 8px;
    background: #fffdf6;
    color: var(--ink);
    border: 1.5px solid var(--ink);
    padding: 8px;
    font: 11px/1.5 "Azeret Mono", ui-monospace, monospace;
    resize: none;
  }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1;
    padding: 9px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  button:hover { background: var(--orange); border-color: var(--orange); color: var(--ink); }
  button.ready { background: var(--lawn); border-color: var(--lawn); color: var(--paper); }
  .saved { color: var(--lawn); font-size: 11px; opacity: 0; transition: opacity 0.3s; }
  .update-status { color: var(--ink-dim); font-size: 10.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪿 Goose Control Panel</h1>
  <div class="sub">negotiate with the goose (results not guaranteed)</div>

  <div class="meter-card">
    <div class="meter-label"><span>Entitlement</span><span id="tier">content</span></div>
    <div class="bar"><div id="fill"></div></div>
  </div>

  <div class="row">
    <label>Mute honks<div class="hint">the honks continue silently, in its heart</div></label>
    <input type="checkbox" id="muted" />
  </div>
  <div class="row">
    <label>Polite mode<div class="hint">work-safe: fewer interruptions, no demands</div></label>
    <input type="checkbox" id="polite" />
  </div>
  <div class="row">
    <label>Focus enforcement<div class="hint">closes youtube, instagram, netflix…</div></label>
    <input type="checkbox" id="focusEnforce" />
  </div>
  <div class="row">
    <label>Footstep sounds<div class="hint">quiet webbed taps (they get old fast)</div></label>
    <input type="checkbox" id="footsteps" />
  </div>
  <div class="row">
    <label>Goose size</label>
    <input type="range" id="scale" min="120" max="260" step="10" />
  </div>
  <div class="row">
    <label>Energy<div class="hint">high: fast &amp; restless · low: slow &amp; sleepy</div></label>
    <input type="range" id="energy" min="0" max="100" step="5" />
  </div>
  <div class="row">
    <label>Max frame rate</label>
    <select id="fps">
      <option value="30">30 fps</option>
      <option value="60">60 fps</option>
      <option value="120">120 fps</option>
    </select>
  </div>

  <div class="row">
    <label>Updates<div class="hint"><span id="up-status" class="update-status">checking…</span></div></label>
    <button id="up-btn" style="flex: 0 0 auto; width: auto; padding: 6px 14px;">Check</button>
  </div>

  <div class="row" style="border-bottom: 0; padding-bottom: 2px;"><label><b>Awareness</b></label></div>
  <div class="row">
    <label>Battery warnings<div class="hint">"your battery is at 12%. charge it. I live here."</div></label>
    <input type="checkbox" id="aw-battery" />
  </div>
  <div class="row">
    <label>Time &amp; absence remarks<div class="hint">greetings, counted absences, 2am judgment</div></label>
    <input type="checkbox" id="aw-time" />
  </div>
  <div class="row">
    <label>Status reports<div class="hint">unsolicited. that's the point</div></label>
    <input type="checkbox" id="aw-reports" />
  </div>
  <div class="row">
    <label>Calendar reminders<div class="hint">10-min warnings; asks for Calendar permission</div></label>
    <input type="checkbox" id="aw-calendar" />
  </div>
  <div class="row">
    <label>Phone suspicion<div class="hint">"you're on your phone, aren't you."</div></label>
    <input type="checkbox" id="aw-phone" />
  </div>

  <div class="row" style="border: 0; display: block;">
    <label>Blocked websites <span class="hint">(domains, one per line, up to 200 — incomplete lines are ignored until they look like a domain)</span> <span class="saved" id="saved-bl">saved</span></label>
    <textarea id="blockDomains" spellcheck="false" style="height: 88px;"></textarea>
  </div>
  <div class="row" style="border: 0; display: block; padding-top: 0;">
    <label>Blocked apps <span class="hint">(exact app names, one per line)</span></label>
    <textarea id="blockApps" spellcheck="false" style="height: 46px;"></textarea>
  </div>

  <div class="row" style="border: 0; display: block;">
    <label>Goose phrases <span class="hint">(one per line)</span> <span class="saved" id="saved">saved</span></label>
    <textarea id="phrases" spellcheck="false"></textarea>
  </div>

  <div class="btns">
    <button id="apologize">Apologize to the goose</button>
    <button id="shush">Shush (1 hour)</button>
    <button id="restart">Restart goose</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let saveTimer = null;
  let awareness = { battery: true, time: true, reports: true, calendar: false, phone: true };

  async function load() {
    const s = await window.panel.getState();
    $('muted').checked = s.settings.muted;
    $('polite').checked = s.settings.polite;
    $('focusEnforce').checked = s.settings.focusEnforce;
    $('footsteps').checked = s.settings.footsteps;
    $('scale').value = s.settings.scale;
    $('energy').value = s.settings.energy ?? 50;
    $('fps').value = String(s.settings.fps || 120);
    awareness = { battery: true, time: true, reports: true, calendar: false, phone: true, ...(s.settings.awareness || {}) };
    for (const k of ['battery', 'time', 'reports', 'calendar', 'phone']) $('aw-' + k).checked = awareness[k];
    $('phrases').value = (s.phrases || []).join('\n');
    $('blockDomains').value = (s.blocklist?.domains || []).join('\n');
    $('blockApps').value = (s.blocklist?.apps || []).join('\n');
    updateMeter(s.meter, s.tier);
  }

  function updateMeter(meter, tier) {
    $('fill').style.width = Math.round(4 + meter * 96) + '%';
    $('tier').textContent = tier || 'content';
  }

  for (const id of ['muted', 'polite', 'focusEnforce', 'footsteps']) {
    $(id).addEventListener('change', () => window.panel.setSettings({ [id]: $(id).checked }));
  }
  $('scale').addEventListener('change', () => window.panel.setSettings({ scale: Number($('scale').value) }));
  $('fps').addEventListener('change', () => window.panel.setSettings({ fps: Number($('fps').value) }));
  $('energy').addEventListener('change', () => window.panel.setSettings({ energy: Number($('energy').value) }));
  for (const k of ['battery', 'time', 'reports', 'calendar', 'phone']) {
    $('aw-' + k).addEventListener('change', () => {
      awareness = { ...awareness, [k]: $('aw-' + k).checked };
      window.panel.setSettings({ awareness });
    });
  }

  const sendPhrases = () => {
    const phrases = $('phrases').value.split('\n').map((l) => l.trim()).filter(Boolean);
    window.panel.setPhrases(phrases);
    $('saved').style.opacity = 1;
    setTimeout(() => { $('saved').style.opacity = 0; }, 1200);
  };
  $('phrases').addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveTimer = null; sendPhrases(); }, 600);
  });

  let blTimer = null;
  const sendBlocklist = () => {
    window.panel.setBlocklist({
      domains: $('blockDomains').value.split('\n').map((l) => l.trim()).filter(Boolean),
      apps: $('blockApps').value.split('\n').map((l) => l.trim()).filter(Boolean),
    });
    $('saved-bl').style.opacity = 1;
    setTimeout(() => { $('saved-bl').style.opacity = 0; }, 1200);
  };
  const saveBlocklist = () => {
    clearTimeout(blTimer);
    blTimer = setTimeout(() => { blTimer = null; sendBlocklist(); }, 1000);
  };
  $('blockDomains').addEventListener('input', saveBlocklist);
  $('blockApps').addEventListener('input', saveBlocklist);
  // Flush pending edits when the panel closes, loses focus, or restarts the
  // app — the debounce timers die with the window otherwise.
  const flushPending = () => {
    if (blTimer) { clearTimeout(blTimer); blTimer = null; sendBlocklist(); }
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; sendPhrases(); }
  };
  window.addEventListener('beforeunload', flushPending);
  window.addEventListener('blur', flushPending);

  $('apologize').addEventListener('click', () => window.panel.apologize());
  $('restart').addEventListener('click', () => {
    flushPending(); // app.exit() fires no beforeunload — save edits first
    $('restart').textContent = 'Restarting…';
    window.panel.restart();
  });
  $('shush').addEventListener('click', () => {
    window.panel.setSettings({ shushUntil: Date.now() + 3600 * 1000 });
    $('shush').textContent = 'Shushed \u2713';
    setTimeout(() => { $('shush').textContent = 'Shush (1 hour)'; }, 1500);
  });

  function renderUpdate(s) {
    const st = s.update || { status: 'dev' };
    const el = $('up-status');
    const btn = $('up-btn');
    btn.classList.remove('ready');
    if (st.status === 'ready') {
      el.textContent = `v${st.available} downloaded`;
      btn.textContent = 'Restart & update';
      btn.classList.add('ready');
    } else if (st.status === 'downloading') {
      el.textContent = `downloading v${st.available || ''} ${st.percent != null ? st.percent + '%' : ''}`;
      btn.textContent = '…';
    } else if (st.status === 'checking') {
      el.textContent = 'checking…';
      btn.textContent = '…';
    } else if (st.status === 'up-to-date') {
      el.textContent = `v${s.appVersion} — up to date`;
      btn.textContent = 'Check';
    } else if (st.status === 'error') {
      el.textContent = 'update check failed';
      btn.textContent = 'Retry';
    } else {
      el.textContent = `v${s.appVersion || ''}${st.status === 'dev' ? ' (dev — updates off)' : ''}`;
      btn.textContent = 'Check';
    }
  }
  $('up-btn').addEventListener('click', async () => {
    const s = await window.panel.getState();
    if (s.update?.status === 'ready') window.panel.installUpdate();
    else window.panel.checkUpdates();
  });

  setInterval(async () => {
    const s = await window.panel.getState();
    updateMeter(s.meter, s.tier);
    renderUpdate(s);
  }, 700);

  load();
</script>
</body>
</html>
