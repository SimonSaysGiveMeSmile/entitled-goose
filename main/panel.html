<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Spline Sans Mono";
    src: url("../assets/fonts/spline-sans-mono-var.woff2") format("woff2");
    font-weight: 400 600;
  }
  :root {
    --green: #1e3a29;
    --green-deep: #16291d;
    --cream: #f3efe2;
    --cream-dim: rgba(243, 239, 226, 0.55);
    --orange: #f58731;
    --rule: rgba(243, 239, 226, 0.14);
  }
  body {
    margin: 0;
    font-family: "Spline Sans Mono", ui-monospace, monospace;
    font-size: 12.5px;
    background: var(--green);
    color: var(--cream);
    user-select: none;
  }
  .wrap { padding: 20px 22px 22px; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.04em; }
  .sub { color: var(--cream-dim); margin-bottom: 16px; font-size: 11px; font-style: italic; }

  .meter-card {
    background: var(--green-deep);
    border: 1px solid var(--rule);
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .meter-label { display: flex; justify-content: space-between; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; }
  #tier { font-weight: 600; color: var(--orange); }
  .bar {
    height: 9px;
    background: rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  #fill {
    height: 100%;
    width: 15%;
    background: linear-gradient(90deg, #7fae74, #e8c34a 55%, var(--orange));
    background-size: 340px 100%;
    transition: width 0.4s;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 2px;
    border-bottom: 1px solid var(--rule);
  }
  .row label { flex: 1; }
  .hint { color: var(--cream-dim); font-size: 10.5px; margin-top: 2px; }
  input[type="range"] { width: 130px; accent-color: var(--orange); }
  input[type="checkbox"] { accent-color: var(--orange); }
  select {
    background: var(--green-deep);
    color: var(--cream);
    border: 1px solid var(--rule);
    font-family: inherit;
    font-size: 12px;
    padding: 3px 6px;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 108px;
    margin-top: 8px;
    background: var(--green-deep);
    color: var(--cream);
    border: 1px solid var(--rule);
    padding: 8px;
    font: 11.5px/1.5 "Spline Sans Mono", ui-monospace, monospace;
    resize: none;
  }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1;
    padding: 9px 10px;
    border: 1.5px solid var(--orange);
    background: var(--orange);
    color: var(--green-deep);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  button:hover { background: var(--cream); border-color: var(--cream); }
  .saved { color: #9fce8f; font-size: 11px; opacity: 0; transition: opacity 0.3s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪿 Goose Control Panel</h1>
  <div class="sub">negotiate with the goose (results not guaranteed)</div>

  <div class="meter-card">
    <div class="meter-label"><span>Entitlement</span><span id="tier">content</span></div>
    <div class="bar"><div id="fill"></div></div>
  </div>

  <div class="row">
    <label>Mute honks<div class="hint">the honks continue silently, in its heart</div></label>
    <input type="checkbox" id="muted" />
  </div>
  <div class="row">
    <label>Polite mode<div class="hint">work-safe: fewer interruptions, no demands</div></label>
    <input type="checkbox" id="polite" />
  </div>
  <div class="row">
    <label>Focus enforcement<div class="hint">closes youtube, instagram, netflix…</div></label>
    <input type="checkbox" id="focusEnforce" />
  </div>
  <div class="row">
    <label>Footstep sounds<div class="hint">quiet webbed taps (they get old fast)</div></label>
    <input type="checkbox" id="footsteps" />
  </div>
  <div class="row">
    <label>Goose size</label>
    <input type="range" id="scale" min="120" max="260" step="10" />
  </div>
  <div class="row">
    <label>Energy<div class="hint">high: fast &amp; restless · low: slow &amp; sleepy</div></label>
    <input type="range" id="energy" min="0" max="100" step="5" />
  </div>
  <div class="row">
    <label>Max frame rate</label>
    <select id="fps">
      <option value="30">30 fps</option>
      <option value="60">60 fps</option>
      <option value="120">120 fps</option>
    </select>
  </div>

  <div class="row" style="border-bottom: 0; padding-bottom: 2px;"><label><b>Awareness</b></label></div>
  <div class="row">
    <label>Battery warnings<div class="hint">"your battery is at 12%. charge it. I live here."</div></label>
    <input type="checkbox" id="aw-battery" />
  </div>
  <div class="row">
    <label>Time &amp; absence remarks<div class="hint">greetings, counted absences, 2am judgment</div></label>
    <input type="checkbox" id="aw-time" />
  </div>
  <div class="row">
    <label>Status reports<div class="hint">unsolicited. that's the point</div></label>
    <input type="checkbox" id="aw-reports" />
  </div>
  <div class="row">
    <label>Calendar reminders<div class="hint">10-min warnings; asks for Calendar permission</div></label>
    <input type="checkbox" id="aw-calendar" />
  </div>

  <div class="row" style="border: 0; display: block;">
    <label>Blocked websites <span class="hint">(domains, one per line, up to 200 — incomplete lines are ignored until they look like a domain)</span> <span class="saved" id="saved-bl">saved</span></label>
    <textarea id="blockDomains" spellcheck="false" style="height: 88px;"></textarea>
  </div>
  <div class="row" style="border: 0; display: block; padding-top: 0;">
    <label>Blocked apps <span class="hint">(exact app names, one per line)</span></label>
    <textarea id="blockApps" spellcheck="false" style="height: 46px;"></textarea>
  </div>

  <div class="row" style="border: 0; display: block;">
    <label>Goose phrases <span class="hint">(one per line)</span> <span class="saved" id="saved">saved</span></label>
    <textarea id="phrases" spellcheck="false"></textarea>
  </div>

  <div class="btns">
    <button id="apologize">Apologize to the goose</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let saveTimer = null;
  let awareness = { battery: true, time: true, reports: true, calendar: false };

  async function load() {
    const s = await window.panel.getState();
    $('muted').checked = s.settings.muted;
    $('polite').checked = s.settings.polite;
    $('focusEnforce').checked = s.settings.focusEnforce;
    $('footsteps').checked = s.settings.footsteps;
    $('scale').value = s.settings.scale;
    $('energy').value = s.settings.energy ?? 50;
    $('fps').value = String(s.settings.fps || 120);
    awareness = { battery: true, time: true, reports: true, calendar: false, ...(s.settings.awareness || {}) };
    for (const k of ['battery', 'time', 'reports', 'calendar']) $('aw-' + k).checked = awareness[k];
    $('phrases').value = (s.phrases || []).join('\n');
    $('blockDomains').value = (s.blocklist?.domains || []).join('\n');
    $('blockApps').value = (s.blocklist?.apps || []).join('\n');
    updateMeter(s.meter, s.tier);
  }

  function updateMeter(meter, tier) {
    $('fill').style.width = Math.round(4 + meter * 96) + '%';
    $('tier').textContent = tier || 'content';
  }

  for (const id of ['muted', 'polite', 'focusEnforce', 'footsteps']) {
    $(id).addEventListener('change', () => window.panel.setSettings({ [id]: $(id).checked }));
  }
  $('scale').addEventListener('change', () => window.panel.setSettings({ scale: Number($('scale').value) }));
  $('fps').addEventListener('change', () => window.panel.setSettings({ fps: Number($('fps').value) }));
  $('energy').addEventListener('change', () => window.panel.setSettings({ energy: Number($('energy').value) }));
  for (const k of ['battery', 'time', 'reports', 'calendar']) {
    $('aw-' + k).addEventListener('change', () => {
      awareness = { ...awareness, [k]: $('aw-' + k).checked };
      window.panel.setSettings({ awareness });
    });
  }

  $('phrases').addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const phrases = $('phrases').value.split('\n').map((l) => l.trim()).filter(Boolean);
      window.panel.setPhrases(phrases);
      $('saved').style.opacity = 1;
      setTimeout(() => { $('saved').style.opacity = 0; }, 1200);
    }, 600);
  });

  let blTimer = null;
  const sendBlocklist = () => {
    window.panel.setBlocklist({
      domains: $('blockDomains').value.split('\n').map((l) => l.trim()).filter(Boolean),
      apps: $('blockApps').value.split('\n').map((l) => l.trim()).filter(Boolean),
    });
    $('saved-bl').style.opacity = 1;
    setTimeout(() => { $('saved-bl').style.opacity = 0; }, 1200);
  };
  const saveBlocklist = () => {
    clearTimeout(blTimer);
    blTimer = setTimeout(sendBlocklist, 1000);
  };
  $('blockDomains').addEventListener('input', saveBlocklist);
  $('blockApps').addEventListener('input', saveBlocklist);
  // Flush pending edits when the panel closes or loses focus — the debounce
  // timer dies with the window otherwise.
  window.addEventListener('beforeunload', () => { if (blTimer) { clearTimeout(blTimer); sendBlocklist(); } });
  window.addEventListener('blur', () => { if (blTimer) { clearTimeout(blTimer); blTimer = null; sendBlocklist(); } });

  $('apologize').addEventListener('click', () => window.panel.apologize());

  setInterval(async () => {
    const s = await window.panel.getState();
    updateMeter(s.meter, s.tier);
  }, 700);

  load();
</script>
</body>
</html>
