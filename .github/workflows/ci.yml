name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax-check all JS entry points
        run: |
          for f in main/*.js renderer/*.js renderer/goose/*.js shared/*.js; do
            node --check "$f"
          done
